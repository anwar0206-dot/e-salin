<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>e-Salin - Handwriting OCR</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        margin: 0;
        padding: 20px;
    }

    .container {
        max-width: 600px;
        margin: auto;
        background: white;
        padding: 25px;
        border-radius: 20px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h1 {
        text-align: center;
        margin-bottom: 5px;
    }

    .subtitle {
        text-align: center;
        color: #666;
        margin-bottom: 25px;
    }

    label, button {
        display: block;
        width: 100%;
        box-sizing: border-box;
        padding: 15px;
        margin: 10px 0;
        border: none;
        border-radius: 12px;
        font-size: 16px;
        cursor: pointer;
        text-align: center;
    }

    label {
        background: #2563eb;
        color: white;
    }

    button {
        background: #16a34a;
        color: white;
    }

    button.secondary {
        background: #7c3aed;
    }

    input[type="file"] {
        display: none;
    }

    #preview {
        width: 100%;
        margin-top: 15px;
        border-radius: 10px;
        display: none;
    }

    textarea {
        width: 100%;
        box-sizing: border-box;
        min-height: 220px;
        padding: 15px;
        margin-top: 15px;
        border: 1px solid #ccc;
        border-radius: 10px;
        font-size: 16px;
        resize: vertical;
    }

    #progress {
        text-align: center;
        margin: 15px 0;
        color: #555;
    }

    .info {
        background: #eef2ff;
        padding: 12px;
        border-radius: 10px;
        margin-top: 15px;
        font-size: 14px;
        color: #444;
    }
</style>
</head>

<body>

<div class="container">

    <h1>📄 e-Salin</h1>

    <div class="subtitle">
        Handwriting → Digital Text
    </div>

    <label for="camera">
        📷 Scan Handwriting
    </label>

    <input
        type="file"
        id="camera"
        accept="image/*"
        capture="environment"
    >

    <label for="gallery">
        🖼️ Pilih Gambar
    </label>

    <input
        type="file"
        id="gallery"
        accept="image/*"
    >

    <img id="preview">

    <div id="progress">
        Belum ada gambar.
    </div>

    <button id="ocrButton">
        🔍 BACA TULISAN
    </button>

    <textarea
        id="result"
        placeholder="Teks yang dibaca akan muncul di sini..."
    ></textarea>

    <button class="secondary" id="copyButton">
        📋 COPY TEXT
    </button>

    <button id="pdfButton">
        📄 SIMPAN SEBAGAI PDF
    </button>

    <div class="info">
        💡 Tip: Ambil gambar dengan pencahayaan yang baik dan pastikan tulisan jelas.
    </div>

</div>


<script>

let selectedImage = null;


// ===============================
// CAMERA
// ===============================

document.getElementById("camera").addEventListener("change", function(e) {

    const file = e.target.files[0];

    if (file) {
        loadImage(file);
    }

});


// ===============================
// GALLERY
// ===============================

document.getElementById("gallery").addEventListener("change", function(e) {

    const file = e.target.files[0];

    if (file) {
        loadImage(file);
    }

});


// ===============================
// LOAD IMAGE
// ===============================

function loadImage(file) {

    const reader = new FileReader();

    reader.onload = function(e) {

        selectedImage = e.target.result;

        const preview = document.getElementById("preview");

        preview.src = selectedImage;

        preview.style.display = "block";

        document.getElementById("progress").innerText =
            "Gambar berjaya dimuatkan. Tekan BACA TULISAN.";

        document.getElementById("result").value = "";

    };

    reader.readAsDataURL(file);

}


// ===============================
// OCR
// ===============================

document.getElementById("ocrButton").addEventListener("click", async function() {

    if (!selectedImage) {

        alert("Sila ambil atau pilih gambar dahulu.");

        return;
    }

    const progress = document.getElementById("progress");

    const result = document.getElementById("result");

    progress.innerText = "🔍 Sedang membaca tulisan...";

    result.value = "";

    try {

        const output = await Tesseract.recognize(
            selectedImage,
            "eng",
            {
                logger: function(info) {

                    if (info.status === "recognizing text") {

                        const percent =
                            Math.round(info.progress * 100);

                        progress.innerText =
                            "🔍 Membaca tulisan... " +
                            percent + "%";
                    }

                }
            }
        );

        result.value = output.data.text;

        progress.innerText =
            "✅ Selesai! Semak dan edit teks jika perlu.";

    }

    catch(error) {

        console.error(error);

        progress.innerText =
            "❌ OCR gagal. Cuba gambar yang lebih jelas.";

    }

});


// ===============================
// COPY TEXT
// ===============================

document.getElementById("copyButton").addEventListener("click", async function() {

    const text = document.getElementById("result").value;

    if (!text.trim()) {

        alert("Tiada teks untuk disalin.");

        return;
    }

    await navigator.clipboard.writeText(text);

    alert("Teks telah disalin!");

});


// ===============================
// TEXT TO PDF
// ===============================

document.getElementById("pdfButton").addEventListener("click", function() {

    const text =
        document.getElementById("result").value;

    if (!text.trim()) {

        alert("Tiada teks untuk dijadikan PDF.");

        return;
    }

    const { jsPDF } = window.jspdf;

    const pdf = new jsPDF();

    const lines = pdf.splitTextToSize(
        text,
        180
    );

    let y = 20;

    lines.forEach(function(line) {

        if (y > 280) {

            pdf.addPage();

            y = 20;
        }

        pdf.text(line, 15, y);

        y += 8;

    });

    pdf.save("e-Salin-Text.pdf");

});

</script>

</body>
</html>
