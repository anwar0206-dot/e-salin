<!DOCTYPE html>
<html lang="ms">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>e-Salin</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #f3f4f6;
}

.container {
    max-width: 600px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.10);
}

.logo {
    text-align: center;
    font-size: 32px;
    font-weight: bold;
    margin-bottom: 5px;
}

.subtitle {
    text-align: center;
    color: #666;
    margin-bottom: 25px;
}

.scan-button {
    display: block;
    width: 100%;
    padding: 18px;
    border-radius: 15px;
    border: none;
    background: #2563eb;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 12px;
}

.gallery-button {
    display: block;
    width: 100%;
    padding: 16px;
    border-radius: 15px;
    border: 2px solid #2563eb;
    background: white;
    color: #2563eb;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

input[type="file"] {
    display: none;
}

#pages {
    margin-top: 20px;
}

.page {
    position: relative;
    margin-bottom: 15px;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid #ddd;
}

.page img {
    width: 100%;
    display: block;
}

.delete-button {
    position: absolute;
    top: 8px;
    right: 8px;
    background: #dc2626;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 14px;
}

.page-number {
    position: absolute;
    bottom: 8px;
    left: 8px;
    background: rgba(0,0,0,0.65);
    color: white;
    padding: 5px 10px;
    border-radius: 8px;
    font-size: 13px;
}

.status {
    text-align: center;
    margin: 15px 0;
    color: #555;
}

.pdf-button {
    width: 100%;
    padding: 18px;
    border: none;
    border-radius: 15px;
    background: #16a34a;
    color: white;
    font-size: 18px;
    font-weight: bold;
    margin-top: 15px;
}

.clear-button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 15px;
    background: #dc2626;
    color: white;
    font-size: 16px;
    margin-top: 10px;
}

.hint {
    background: #eff6ff;
    padding: 12px;
    border-radius: 12px;
    margin-top: 20px;
    font-size: 14px;
    color: #374151;
    line-height: 1.5;
}

</style>

</head>

<body>

<div class="container">

    <div class="logo">
        📄 e-Salin
    </div>

    <div class="subtitle">
        Handwriting → PDF
    </div>


    <!-- CAMERA -->

    <label for="camera"
           class="scan-button">

        📷 SCAN DOKUMEN

    </label>

    <input
        type="file"
        id="camera"
        accept="image/*"
        capture="environment"
    >


    <!-- GALLERY -->

    <label for="gallery"
           class="gallery-button">

        🖼️ PILIH DARI GALERI

    </label>

    <input
        type="file"
        id="gallery"
        accept="image/*"
        multiple
    >


    <!-- STATUS -->

    <div class="status"
         id="status">

        Belum ada halaman.

    </div>


    <!-- PAGES -->

    <div id="pages"></div>


    <!-- PDF -->

    <button
        class="pdf-button"
        id="pdfButton">

        📄 JANA & DOWNLOAD PDF

    </button>


    <!-- CLEAR -->

    <button
        class="clear-button"
        id="clearButton">

        🗑️ PADAM SEMUA

    </button>


    <div class="hint">

        💡 <b>Cara guna:</b><br>
        1. Tekan SCAN DOKUMEN.<br>
        2. Ambil gambar nota.<br>
        3. Tambah halaman jika perlu.<br>
        4. Tekan JANA & DOWNLOAD PDF.

    </div>

</div>


<script>

const { jsPDF } = window.jspdf;

let pages = [];


// ========================================
// CAMERA
// ========================================

document
.getElementById("camera")
.addEventListener("change", function(event) {

    const file = event.target.files[0];

    if (file) {

        addImage(file);

    }

    event.target.value = "";

});


// ========================================
// GALLERY
// ========================================

document
.getElementById("gallery")
.addEventListener("change", function(event) {

    const files =
        Array.from(event.target.files);

    files.forEach(function(file) {

        addImage(file);

    });

    event.target.value = "";

});


// ========================================
// ADD IMAGE
// ========================================

function addImage(file) {

    const reader = new FileReader();

    reader.onload = function(event) {

        pages.push(event.target.result);

        displayPages();

    };

    reader.readAsDataURL(file);

}


// ========================================
// DISPLAY PAGES
// ========================================

function displayPages() {

    const container =
        document.getElementById("pages");

    container.innerHTML = "";

    pages.forEach(function(image, index) {

        const page =
            document.createElement("div");

        page.className = "page";

        page.innerHTML = `

            <img src="${image}">

            <div class="page-number">
                Page ${index + 1}
            </div>

            <button
                class="delete-button"
                onclick="deletePage(${index})">

                ✕

            </button>

        `;

        container.appendChild(page);

    });


    document.getElementById("status").innerText =

        pages.length === 0

        ? "Belum ada halaman."

        : pages.length +
          " halaman telah ditambah.";

}


// ========================================
// DELETE PAGE
// ========================================

function deletePage(index) {

    pages.splice(index, 1);

    displayPages();

}


// ========================================
// CLEAR
// ========================================

document
.getElementById("clearButton")
.addEventListener("click", function() {

    if (pages.length === 0) {

        return;

    }

    if (
        confirm(
            "Padam semua halaman?"
        )
    ) {

        pages = [];

        displayPages();

    }

});


// ========================================
// GENERATE PDF
// ========================================

document
.getElementById("pdfButton")
.addEventListener("click", async function() {

    if (pages.length === 0) {

        alert(
            "Sila scan sekurang-kurangnya satu halaman."
        );

        return;

    }


    const button =
        document.getElementById("pdfButton");


    button.innerText =
        "⏳ Menjana PDF...";


    const pdf =
        new jsPDF(
            "p",
            "mm",
            "a4"
        );


    for (
        let i = 0;
        i < pages.length;
        i++
    ) {


        if (i > 0) {

            pdf.addPage();

        }


        const img =
            await loadImage(
                pages[i]
            );


        const pageWidth = 210;

        const pageHeight = 297;

        const margin = 10;


        const maxWidth =
            pageWidth - margin * 2;

        const maxHeight =
            pageHeight - margin * 2;


        let width =
            img.width;

        let height =
            img.height;


        const ratio =
            Math.min(
                maxWidth / width,
                maxHeight / height
            );


        width =
            width * ratio;

        height =
            height * ratio;


        const x =
            (pageWidth - width) / 2;

        const y =
            (pageHeight - height) / 2;


        pdf.addImage(
            img,
            "JPEG",
            x,
            y,
            width,
            height
        );

    }


    pdf.save(
        "e-Salin.pdf"
    );


    button.innerText =
        "📄 JANA & DOWNLOAD PDF";

});


// ========================================
// LOAD IMAGE
// ========================================

function loadImage(src) {

    return new Promise(function(resolve) {

        const img =
            new Image();

        img.onload =
            function() {

                resolve(img);

            };

        img.src = src;

    });

}

</script>

</body>

</html>
