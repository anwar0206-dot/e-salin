<!-- CROP AREA -->

<div id="cropContainer" class="crop-container">

<h3>✂️ Crop Dokumen</h3>

<div class="crop-box">

<img id="cropImage">

</div>

<button
    class="crop-button"
    onclick="cropAndAddPage()">

✂️ CROP & TAMBAH HALAMAN

</button>

<button
    class="skip-button"
    onclick="skipAddPage()">

✅ SKIP / SIAP

</button>

</div>

Kemudian tambahkan CSS ini dalam bahagian <style>:

.skip-button {
    width: 100%;
    padding: 15px;
    margin-top: 10px;
    border: none;
    border-radius: 10px;
    background: #6b7280;
    color: white;
    font-size: 17px;
    font-weight: bold;
}

Dan dalam bahagian <script>, tukarkan fungsi cropImage() kepada:

function cropAndAddPage() {

    if (!cropper) {

        alert("Sila pilih gambar dahulu.");

        return;

    }

    const canvas = cropper.getCroppedCanvas({

        imageSmoothingEnabled: true,

        imageSmoothingQuality: "high"

    });

    const croppedImage =
        canvas.toDataURL("image/jpeg", 0.9);

    pages.push(croppedImage);

    displayPages();

    cropper.destroy();

    cropper = null;

    document
    .getElementById("cropContainer")
    .style.display = "none";

    window.scrollTo({

        top: document.body.scrollHeight,

        behavior: "smooth"

    });
}
