<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>e-Salin</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    margin: 0;
    padding: 20px;
    text-align: center;
}

.container {
    max-width: 500px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}

h1 {
    margin-bottom: 5px;
    color: #222;
}

.subtitle {
    color: #666;
    margin-bottom: 25px;
}

button {
    width: 100%;
    padding: 16px;
    margin: 8px 0;
    border: none;
    border-radius: 12px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.camera {
    background: #2563eb;
    color: white;
}

.gallery {
    background: #e5e7eb;
    color: #222;
}

.pdf {
    background: #16a34a;
    color: white;
}

.clear {
    background: #dc2626;
    color: white;
}

input {
    display: none;
}

#preview {
    margin-top: 20px;
}

.page {
    position: relative;
    margin-bottom: 15px;
}

.page img {
    width: 100%;
    border-radius: 10px;
    border: 1px solid #ddd;
}

.page-number {
    position: absolute;
    top: 8px;
    left: 8px;
    background: rgba(0,0,0,0.7);
    color: white;
    padding: 5px 9px;
    border-radius: 8px;
    font-size: 13px;
}

.delete {
    margin-top: 5px;
    background: #ef4444;
    color: white;
    padding: 8px 15px;
    width: auto;
    font-size: 14px;
}

.info {
    margin-top: 20px;
    font-size: 14px;
    color: #666;
}
</style>
</head>

<body>

<div class="container">

    <h1>📄 e-Salin</h1>

    <div class="subtitle">
        Scan tulisan dan simpan sebagai PDF
    </div>

    <!-- CAMERA -->
    <label for="camera">
        <div class="button camera">
            📷 SCAN DOKUMEN
        </div>
    </label>

    <input
        type="file"
        id="camera"
        accept="image/*"
        capture="environment"
    >

    <!-- GALLERY -->
    <label for="gallery">
        <div class="button gallery">
            🖼️ PILIH DARI GALERI
        </div>
    </label>

    <input
        type="file"
        id="gallery"
        accept="image/*"
        multiple
    >

    <!-- PREVIEW -->
    <div id="preview"></div>

    <!-- PDF -->
    <button class="pdf" onclick="generatePDF()">
        📄 JANA & DOWNLOAD PDF
    </button>

    <!-- CLEAR -->
    <button class="clear" onclick="clearAll()">
        🗑️ PADAM SEMUA
    </button>

    <div class="info">
        e-Salin membantu pelajar menukar gambar nota atau tulisan tangan kepada fail PDF.
    </div>

</div>

<script>

let pages = [];

// CAMERA
document.getElementById("camera").addEventListener("change", function(e) {

    const files = e.target.files;

    if (!files.length) return;

    addFiles(files);

    this.value = "";

});

// GALLERY
document.getElementById("gallery").addEventListener("change", function(e) {

    const files = e.target.files;

    if (!files.length) return;

    addFiles(files);

    this.value = "";

});

// ADD FILES
function addFiles(files) {

    for (let file of files) {

        if (!file.type.startsWith("image/")) continue;

        const reader = new FileReader();

        reader.onload = function(e) {

            pages.push(e.target.result);

            displayPages();

        };

        reader.readAsDataURL(file);
    }
}

// DISPLAY
function displayPages() {

    const preview = document.getElementById("preview");

    preview.innerHTML = "";

    pages.forEach((src, index) => {

        const div = document.createElement("div");

        div.className = "page";

        div.innerHTML = `
            <div class="page-number">
                Page ${index + 1}
            </div>

            <img src="${src}">

            <button
                class="delete"
                onclick="deletePage(${index})">
                Padam
            </button>
        `;

        preview.appendChild(div);

    });

}

// DELETE
function deletePage(index) {

    pages.splice(index, 1);

    displayPages();

}

// CLEAR
function clearAll() {

    pages = [];

    displayPages();

}

// GENERATE PDF
async function generatePDF() {

    if (pages.length === 0) {

        alert("Sila scan atau pilih gambar dahulu.");

        return;
    }

    const { jsPDF } = window.jspdf;

    const pdf = new jsPDF("p", "mm", "a4");

    for (let i = 0; i < pages.length; i++) {

        if (i > 0) {
            pdf.addPage();
        }

        const img = new Image();

        img.src = pages[i];

        await new Promise(resolve => {

            img.onload = resolve;

        });

        const pageWidth = 210;
        const pageHeight = 297;

        const margin = 10;

        let width = img.width;
        let height = img.height;

        const maxWidth = pageWidth - (margin * 2);
        const maxHeight = pageHeight - (margin * 2);

        const ratio = Math.min(
            maxWidth / width,
            maxHeight / height
        );

        width *= ratio;
        height *= ratio;

        const x = (pageWidth - width) / 2;
        const y = (pageHeight - height) / 2;

        pdf.addImage(
            img,
            "JPEG",
            x,
            y,
            width,
            height
        );
    }

    pdf.save("e-Salin.pdf");

}

</script>

</body>
</html>
