<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>e-Salin Scanner</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        margin: 0;
        padding: 20px;
        text-align: center;
    }

    .container {
        max-width: 600px;
        margin: auto;
        background: white;
        padding: 25px;
        border-radius: 20px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h1 {
        margin-bottom: 5px;
    }

    .subtitle {
        color: #666;
        margin-bottom: 25px;
    }

    button,
    label {
        display: block;
        width: 100%;
        box-sizing: border-box;
        padding: 15px;
        margin: 10px 0;
        border: none;
        border-radius: 12px;
        font-size: 16px;
        cursor: pointer;
        background: #2563eb;
        color: white;
    }

    button:hover,
    label:hover {
        opacity: 0.9;
    }

    #gallery {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        margin-top: 20px;
    }

    .page {
        position: relative;
        border: 1px solid #ddd;
        border-radius: 10px;
        overflow: hidden;
        background: #fafafa;
    }

    .page img {
        width: 100%;
        display: block;
    }

    .delete {
        position: absolute;
        top: 5px;
        right: 5px;
        width: auto;
        padding: 7px 10px;
        margin: 0;
        background: #dc2626;
        border-radius: 8px;
    }

    #generate {
        background: #16a34a;
        margin-top: 25px;
    }

    #clear {
        background: #dc2626;
    }

    input[type="file"] {
        display: none;
    }

    #status {
        margin-top: 15px;
        color: #555;
    }
</style>
</head>

<body>

<div class="container">

    <h1>📄 e-Salin</h1>

    <div class="subtitle">
        Handwriting → PDF
    </div>

    <!-- CAMERA -->
    <label for="camera">
        📷 Ambil Gambar
    </label>

    <input
        type="file"
        id="camera"
        accept="image/*"
        capture="environment"
    >

    <!-- GALLERY -->
    <label for="galleryInput">
        🖼️ Pilih Dari Galeri
    </label>

    <input
        type="file"
        id="galleryInput"
        accept="image/*"
        multiple
    >

    <!-- IMAGE PREVIEW -->
    <div id="gallery"></div>

    <div id="status">
        Belum ada halaman.
    </div>

    <!-- GENERATE PDF -->
    <button id="generate">
        📄 JANA PDF
    </button>

    <!-- CLEAR -->
    <button id="clear">
        🗑️ PADAM SEMUA
    </button>

</div>

<script>

const { jsPDF } = window.jspdf;

let pages = [];

// ===============================
// CAMERA
// ===============================

document.getElementById("camera").addEventListener("change", function(e) {

    const file = e.target.files[0];

    if (file) {
        addImage(file);
    }

    e.target.value = "";
});


// ===============================
// GALLERY
// ===============================

document.getElementById("galleryInput").addEventListener("change", function(e) {

    const files = Array.from(e.target.files);

    files.forEach(file => {
        addImage(file);
    });

    e.target.value = "";
});


// ===============================
// ADD IMAGE
// ===============================

function addImage(file) {

    const reader = new FileReader();

    reader.onload = function(e) {

        pages.push(e.target.result);

        displayPages();

    };

    reader.readAsDataURL(file);
}


// ===============================
// DISPLAY
// ===============================

function displayPages() {

    const gallery = document.getElementById("gallery");

    gallery.innerHTML = "";

    pages.forEach((image, index) => {

        const div = document.createElement("div");

        div.className = "page";

        div.innerHTML = `
            <img src="${image}">
            <button
                class="delete"
                onclick="deletePage(${index})">
                ✕
            </button>
        `;

        gallery.appendChild(div);

    });

    document.getElementById("status").innerText =
        pages.length === 0
        ? "Belum ada halaman."
        : pages.length + " halaman telah ditambah.";
}


// ===============================
// DELETE PAGE
// ===============================

function deletePage(index) {

    pages.splice(index, 1);

    displayPages();

}


// ===============================
// CLEAR ALL
// ===============================

document.getElementById("clear").addEventListener("click", function() {

    if (pages.length === 0) return;

    if (confirm("Padam semua halaman?")) {

        pages = [];

        displayPages();

    }

});


// ===============================
// GENERATE PDF
// ===============================

document.getElementById("generate").addEventListener("click", async function() {

    if (pages.length === 0) {

        alert("Sila ambil atau pilih gambar terlebih dahulu.");

        return;
    }

    const pdf = new jsPDF("p", "mm", "a4");

    for (let i = 0; i < pages.length; i++) {

        if (i > 0) {
            pdf.addPage();
        }

        const img = await loadImage(pages[i]);

        const pageWidth = 210;
        const pageHeight = 297;

        const margin = 10;

        const maxWidth = pageWidth - (margin * 2);
        const maxHeight = pageHeight - (margin * 2);

        let width = img.width;
        let height = img.height;

        const ratio = Math.min(
            maxWidth / width,
            maxHeight / height
        );

        width *= ratio;
        height *= ratio;

        const x = (pageWidth - width) / 2;
        const y = (pageHeight - height) / 2;

        pdf.addImage(
            img,
            "JPEG",
            x,
            y,
            width,
            height
        );
    }

    pdf.save("e-Salin.pdf");

});


// ===============================
// LOAD IMAGE
// ===============================

function loadImage(src) {

    return new Promise((resolve) => {

        const img = new Image();

        img.onload = function() {
            resolve(img);
        };

        img.src = src;

    });

}

</script>

</body>
</html>
